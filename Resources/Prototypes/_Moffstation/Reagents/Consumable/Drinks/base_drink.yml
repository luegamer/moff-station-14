
- type: reagent
  id: BaseEthyl
  group: Drinks
  abstract: true
  slipData:
    requiredSlipSpeed: 3.5
  friction: 0.4
  metabolisms:
    Digestion:
      metabolites:
        Ethylredoxrazine: 0.2
      effects:
      - !type:SatiateThirst
        factor: 2
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 0.25
  - !type:PlantAdjustWater
    amount: 0.7

# Chilled drinks
- type: reagent
  id: BaseChilled # Moffstation - ice is now cold
  parent: BaseDrink
  abstract: true
  metabolisms:
    Digestion:
      effects:
      - !type:AdjustTemperature
        amount: -2000
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Cold: 0.03
      - !type:AdjustTemperature
        conditions:
        - !type:TemperatureCondition
          min: 160.15
        amount: -2000
    Extinguish:
      methods: [ Touch ]
      effects:
      - !type:Extinguish 

