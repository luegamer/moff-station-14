# Base organ 
- type: entity
  id: BaseAvaliOrgan 
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _Moffstation/Mobs/Species/Avali/organs.rsi 
  - type: Organ
  - type: Edible
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 4
        - ReagentId: Ammonia # Residual in blood
          Quantity: 1
  - type: FlavorProfile
    flavors:
      - terrible
  - type: Tag
    tags:
      - Meat

- type: entity
  id: OrganAvaliStomach
  parent: BaseAvaliOrgan
  name: stomach
  description: "A stomach that reeks of ammonia."
  components:
  - type: Sprite
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
  - type: Stomach
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [ Avali ]
    groups:
    - id: Food
    - id: Drink

- type: entity
  parent: BaseAvaliOrgan 
  id: OrganAvaliLiver
  name: liver
  description: "Smells awful."
  components:
  - type: Sprite
    state: liver
  - type: Item
    size: Small
    heldPrefix: liver
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    maxReagents: 1
    metabolizerTypes: [ Avali ]
    groups:
    - id: Alcohol

- type: entity
  parent: BaseAvaliOrgan
  id: OrganAvaliHeart
  name: heart
  description: "The heart of an avali."
  components:
  - type: Sprite
    state: heart-on
  - type: Item
    size: Small
    heldPrefix: heart
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Avali ]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic

- type: entity
  parent: BaseAvaliOrgan
  id: OrganAvaliLungs
  name: lungs
  description: "The slightly-transparent lungs of an Avali."
  components:
  - type: Sprite
    layers:
      - state: lung-l
      - state: lung-r
  - type: Item
    size: Small
    heldPrefix: lungs
  - type: Lung
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Avali ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      Lung:
        maxVol: 100.0
        canReact: false

- type: entity
  parent: OrganHumanBrain
  id: OrganAvaliBrain
  name: brain
  description: "The source of endless magnetically-charged migranes. Zzztt..."
  components:
  - type: Sprite
    sprite: _Moffstation/Mobs/Species/Avali/organs.rsi 

- type: entity
  id: OrganAvaliKidneys
  parent: BaseAvaliOrgan
  name: kidneys
  description: "Filters toxins from the bloodstream. You're not exactly sure what you're looking at."
  components:
  - type: Sprite
    layers:
      - state: kidney-l
      - state: kidney-r
  - type: Item
    size: Small
    heldPrefix: kidneys
  # The kidneys just remove anything that doesn't currently have any metabolisms, as a stopgap.
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Avali ]
    removeEmpty: true

- type: entity
  id: OrganAvaliEyes
  parent: BaseAvaliOrgan
  name: eyes
  description: "Not very good at seeing. Looks like this pair has been augmented to compensate."
  components:
  - type: Sprite
    layers:
      - state: eyeball-l
      - state: eyeball-r
  - type: Item
    size: Small
    heldPrefix: eyeballs
